# Verificacao automatica de toda alteracao proposta (FR-016).
#
# Nenhuma etapa usa continue-on-error: etapa que avisa e deixa passar e decoracao.
# Cada etapa tem nome proprio, porque a protecao do ramo principal e configurada
# selecionando essas verificacoes pelo nome — ver README.md.
#
# Roda so em Linux, deliberadamente. A paridade com Windows e travada na origem
# por tres mecanismos (caixa de import na verificacao de tipos, fim de linha no
# .gitattributes e versao do Node fixada). Uma matriz com Windows dobraria o
# consumo de minutos do plano gratuito para reconferir o que ja esta travado.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    name: Verificacoes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run verificar:tipos

      # Regera os tipos a partir do esquema e falha se o versionado diferir. Sem
      # este passo, "os tipos estao atualizados" e promessa: o arquivo continua
      # compilando depois que alguem altera o banco, so que descrevendo um
      # esquema que nao existe mais (FR-005).
      #
      # Sem continue-on-error e sem `if:` que pule quando o segredo falta, pelo
      # mesmo motivo da linha 3: um passo que se ignora quando nao consegue rodar
      # e um verde que nao mediu nada. Se a SUPABASE_ACCESS_TOKEN nao estiver no
      # repositorio, este passo fica VERMELHO dizendo que NAO VERIFICOU — que e a
      # verdade — em vez de verde por omissao.
      - name: Tipos do banco conferem com o esquema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
        run: npm run banco:tipos:check

      - name: Analise estatica
        run: npm run lint

      - name: Formatacao
        run: npm run formatar:check

      - name: Verificar tokens
        run: npm run verificar:tokens

      - name: Testes de unidade
        run: npm test

      - name: Build
        run: npm run build

      # A maquina do CI vem sem navegador. Esquecer este passo e a causa mais
      # comum de primeiro CI vermelho, com erro que nao tem nada a ver com o codigo.
      - name: Instalar o navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        run: npx playwright test

      # Roda contra a versao compilada pelo passo Build, nunca contra o servidor
      # de desenvolvimento: medir desempenho em modo dev produz numero sem sentido.
      - name: Desempenho e acessibilidade por pagina
        run: npm run test:desempenho

      - name: Guardar relatorios quando algo falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 7
